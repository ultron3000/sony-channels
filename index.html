<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cloud TV</title>

<link rel="icon" href="https://static.readdy.ai/image/0ece273271e400e488b9947cb1e99e9a/a79b6f32c71c4ee2094ead0eb9c84c9b.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#050509;
  --border:rgba(255,255,255,.08);
  --radius:18px;
}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:
    radial-gradient(1200px 600px at top, #0b1020, transparent),
    radial-gradient(800px 400px at bottom, #020024, transparent),
    var(--bg);
  color:#fff;
}

/* HEADER */
header {
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  background:rgba(5,5,9,.65);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

header img { height:40px; }
header span { font-size:20px; font-weight:700; }

/* MAIN */
main {
  padding:14px;
  max-width:1600px;
  margin:auto;
}

/* GRID */
.grid { display:grid; gap:14px; }
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:601px) and (max-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1025px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}

/* CARD */
.card {
  background:linear-gradient(180deg,#101018,#07070c);
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 10px 25px rgba(0,0,0,.55);
  transition:transform .25s ease;
  cursor:pointer;
}
.card:active { transform:scale(.96); }

.logo {
  height:120px;
  background:#fff center/contain no-repeat;
}

.title {
  padding:10px 8px;
  text-align:center;
  font-size:13px;
  font-weight:600;
  background:rgba(0,0,0,.5);
  border-top:1px solid var(--border);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* LOADING */
.loading {
  text-align:center;
  padding:60px 20px;
  opacity:.75;
  font-size:14px;
}

/* ===== MODAL PLAYER ===== */
#playerModal {
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:9999;
}

#playerFrame {
  width:100%;
  height:100%;
  border:none;
}

#closeBtn {
  position:absolute;
  top:10px;
  right:10px;
  z-index:10000;
  background:#000;
  color:#fff;
  border:none;
  font-size:22px;
  padding:6px 10px;
  cursor:pointer;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
  <img src="https://static.readdy.ai/image/0ece273271e400e488b9947cb1e99e9a/a79b6f32c71c4ee2094ead0eb9c84c9b.png" alt="Cloud TV">
  <span>Sony Channels</span>
</header>

<main>
  <div id="loading" class="loading">Loading Sony channels…</div>
  <div id="channels" class="grid"></div>
</main>

<!-- MODAL PLAYER -->
<div id="playerModal">
  <button id="closeBtn" onclick="closePlayer()">✕</button>
  <iframe
    id="playerFrame"
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture">
  </iframe>
</div>

<script>
fetch('./channels.json')
  .then(res => res.json())
  .then(data => {
    document.getElementById('loading').style.display = 'none';
    const grid = document.getElementById('channels');

    data.forEach(ch => {
      const card = document.createElement('div');
      card.className = 'card';

      card.onclick = () => openPlayer(ch);

      card.innerHTML = `
        <div class="logo" style="background-image:url('${ch.logo || ''}')"></div>
        <div class="title">${ch.title || 'Live Channel'}</div>
      `;

      grid.appendChild(card);
    });
  })
  .catch(err => {
    document.getElementById('loading').innerText = 'Failed to load channels';
    console.error(err);
  });

function openPlayer(ch) {
  const modal = document.getElementById('playerModal');
  const frame = document.getElementById('playerFrame');

  modal.style.display = 'block';

  frame.src =
    `s-mpd.html?url=${encodeURIComponent(ch.url)}&keyId=${ch.keyId}&key=${ch.key}`;
}

function closePlayer() {
  const modal = document.getElementById('playerModal');
  const frame = document.getElementById('playerFrame');

  frame.src = '';
  modal.style.display = 'none';
}
</script>

</body>
</html>
