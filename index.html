<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud TV – Sony</title>

<link rel="icon" href="https://static.readdy.ai/image/0ece273271e400e488b9947cb1e99e9a/a79b6f32c71c4ee2094ead0eb9c84c9b.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:Inter,sans-serif;
  background:#050509;
  color:#fff;
}

/* HEADER */
header {
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  background:#07070c;
}

/* GRID */
.grid {
  display:grid;
  gap:14px;
  padding:14px;
}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:601px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}

.card {
  background:#0b0b12;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
}
.logo {
  height:120px;
  background:#fff center/contain no-repeat;
}
.title {
  padding:8px;
  text-align:center;
  font-size:13px;
  font-weight:600;
}

/* MODAL PLAYER */
#playerModal {
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:9999;
}

.shaka-video-container {
  width:100%;
  height:calc(100% - 70px);
}

video {
  width:100%;
  height:100%;
  background:#000;
}

/* CONTROLS */
#controls {
  height:70px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  background:#07070c;
}

.btn {
  background:#111;
  border:1px solid rgba(255,255,255,.15);
  color:#fff;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <img src="https://static.readdy.ai/image/0ece273271e400e488b9947cb1e99e9a/a79b6f32c71c4ee2094ead0eb9c84c9b.png" height="36">
  <span>Sony Channels</span>
</header>

<div class="grid" id="channels"></div>

<!-- PLAYER MODAL -->
<div id="playerModal">
  <div class="shaka-video-container" data-shaka-player>
    <video id="video" autoplay muted playsinline></video>
  </div>

  <div id="controls">
    <button id="prevBtn" class="btn"><i class="fas fa-step-backward"></i></button>
    <button id="playPauseBtn" class="btn"><i class="fas fa-play"></i></button>
    <button id="nextBtn" class="btn"><i class="fas fa-step-forward"></i></button>
    <button id="muteBtn" class="btn"><i class="fas fa-volume-up"></i></button>
    <button id="fullscreenBtn" class="btn"><i class="fas fa-expand"></i></button>
    <button id="closeBtn" class="btn"><i class="fas fa-times"></i></button>
  </div>
</div>

<script>
let channels = [];
let currentIndex = 0;
let player, ui;

fetch('./channels.json')
  .then(r => r.json())
  .then(data => {
    channels = data;
    render();
  });

function render() {
  const grid = document.getElementById('channels');
  grid.innerHTML = '';
  channels.forEach((ch, i) => {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `
      <div class="logo" style="background-image:url('${ch.logo}')"></div>
      <div class="title">${ch.title}</div>
    `;
    c.onclick = () => openPlayer(i);
    grid.appendChild(c);
  });
}

async function initPlayer() {
  shaka.polyfill.installAll();
  const video = document.getElementById('video');
  player = new shaka.Player(video);
  ui = new shaka.ui.Overlay(player, document.querySelector('.shaka-video-container'), video);

  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    request.headers['Referer'] = 'https://www.jiotv.com/';
    request.headers['User-Agent'] =
      'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';
  });
}

async function openPlayer(index) {
  currentIndex = index;
  document.getElementById('playerModal').style.display = 'block';

  if (!player) await initPlayer();

  const ch = channels[index];

  player.configure({
    drm: { clearKeys: { [ch.keyId]: ch.key } }
  });

  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    request.headers['Cookie'] = `__hdnea__=${ch.hdnea || ''}`;
    if (!request.uris[0].includes('__hdnea__')) {
      const sep = request.uris[0].includes('?') ? '&' : '?';
      request.uris[0] += sep + `__hdnea__=${ch.hdnea || ''}`;
    }
  });

  await player.load(ch.url);

  const video = document.getElementById('video');
  video.muted = false;
  await video.play();
}

function closePlayer() {
  document.getElementById('playerModal').style.display = 'none';
  document.getElementById('video').pause();
}

/* CONTROLS */
playPauseBtn.onclick = () => {
  const v = video;
  v.paused ? v.play() : v.pause();
};
muteBtn.onclick = () => video.muted = !video.muted;
fullscreenBtn.onclick = () => video.requestFullscreen();
prevBtn.onclick = () => currentIndex > 0 && openPlayer(currentIndex - 1);
nextBtn.onclick = () => currentIndex < channels.length - 1 && openPlayer(currentIndex + 1);
closeBtn.onclick = closePlayer;
</script>

</body>
</html>
